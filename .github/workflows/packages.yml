# Build RPM and DEB packages on every push and pull request, and attach them
# (plus the source tarball) to a GitHub release when a version tag is pushed.
# Running the workflow by hand with "tag" rebuilds an existing tag's packages
# and replaces the assets of its release. Running it with "release" builds the
# chosen branch as a new version, and creates that tag and its release.
name: packages
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and (re)publish, e.g. 0.1.0'
        required: false
        default: ''
      release:
        description: 'New version to release from the chosen branch, e.g. 0.2.0 (creates the tag)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch cockpit library and node modules
        run: make pkg/lib/cockpit-po-plugin.js package-lock.json
      - name: Lint
        run: npm run eslint && npm run stylelint && npm run typecheck
      - name: Unit tests
        run: npm test

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      # release version when building a tag; otherwise derived from git describe
      TAG: ${{ inputs.tag || inputs.release || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - name: Install build dependencies
        run: dnf install -y git make jq nodejs npm nodejs-esbuild rpm-build gettext libappstream-glib xz tar findutils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build source tarballs and RPM
        run: make rpm ${TAG:+VERSION=$TAG}
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: |
            cockpit-letsencrypt-*.noarch.rpm
            cockpit-letsencrypt-*.tar.xz

  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      # release version when building a tag; otherwise derived from git describe
      TAG: ${{ inputs.tag || inputs.release || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make nodejs npm build-essential debhelper dpkg-dev gettext
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build DEB
        run: make deb ${TAG:+VERSION=$TAG}
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: cockpit-letsencrypt_*_all.deb

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != '' || inputs.release != ''
    needs: [check, rpm, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || inputs.release || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create or update release
        run: |
          set -x
          files="$(ls cockpit-letsencrypt-*.rpm cockpit-letsencrypt_*.deb cockpit-letsencrypt-[0-9]*.tar.xz)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # replace all assets of an existing release
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                  xargs -r -n1 gh release delete-asset "$TAG" --repo "$GITHUB_REPOSITORY" -y
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
              # for a new release this also creates the tag, on the commit that was built
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                  --title "$TAG" --generate-notes $files
          fi
